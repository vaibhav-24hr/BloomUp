services:
  # Backend API (Node.js / Express)
  - type: web
    name: bloomup-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # You'll set this manually in the Render dashboard
      - key: DB_NAME
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false   # Will be set to your frontend URL after deploy
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  # Frontend (React / Vite static site)
  - type: web
    name: bloomup
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

