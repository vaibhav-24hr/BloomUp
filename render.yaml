services:
  # Backend API (Node.js / Express)
  - type: web
    name: bloomup-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # Set in Render dashboard with your Atlas connection string
      - key: DB_NAME
        value: BloomUp
      - key: ACCESS_TOKEN_SECRET
        sync: false   # Generate or paste a random secret
      - key: OPENAI_API_KEY
        sync: false   # Optional: add your OpenAI API key or leave empty
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false   # Set to frontend URL after deploy (e.g. https://bloomup.onrender.com)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  # Frontend (React / Vite static site)
  - type: web
    name: bloomup
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false   # Set to backend URL (e.g. https://bloomup-api.onrender.com)
